<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dragon Browser</title>
<style>
  :root {
    --red: #c41e3a;
    --bg-dark: #141824;
    --bg-panel: #1a1f2e;
    --text: #f2f2f2;
    --text-dim: #9aa0ac;
    --border: #2a2f3d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg-dark);
    color: var(--text);
    user-select: none;
    -webkit-app-region: drag;
    overflow: hidden;
  }
  #tabbar {
    display: flex;
    align-items: center;
    height: 40px;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    padding: 0 8px;
    gap: 4px;
    -webkit-app-region: drag;
  }
  .tab {
    -webkit-app-region: no-drag;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    border-radius: 8px 8px 0 0;
    background: transparent;
    color: var(--text-dim);
    font-size: 12px;
    max-width: 180px;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tab.active {
    background: var(--bg-dark);
    color: var(--text);
  }
  .tab .close-btn {
    opacity: 0.6;
    padding: 0 4px;
  }
  .tab .close-btn:hover { opacity: 1; color: var(--red); }
  #new-tab-btn {
    -webkit-app-region: no-drag;
    width: 26px; height: 26px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 6px;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 16px;
  }
  #new-tab-btn:hover { background: var(--border); color: var(--red); }

  #toolbar {
    -webkit-app-region: no-drag;
    display: flex;
    align-items: center;
    height: 44px;
    background: var(--bg-dark);
    border-bottom: 1px solid var(--border);
    padding: 0 10px;
    gap: 8px;
  }
  .nav-btn {
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 8px;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 14px;
  }
  .nav-btn:hover { background: var(--bg-panel); color: var(--text); }
  #address-bar {
    flex: 1;
    height: 30px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 0 12px;
    font-size: 13px;
    outline: none;
  }
  #address-bar:focus { border-color: var(--red); }
  #shield {
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    color: var(--red);
    font-size: 14px;
    cursor: default;
  }
</style>
</head>
<body>
  <div id="tabbar">
    <div id="tabs-container" style="display:flex; gap:4px;"></div>
    <div id="new-tab-btn">+</div>
  </div>
  <div id="toolbar">
    <div class="nav-btn" id="back">&#8592;</div>
    <div class="nav-btn" id="forward">&#8594;</div>
    <div class="nav-btn" id="reload">&#8635;</div>
    <input id="address-bar" type="text" placeholder="Search or enter address" />
    <div id="shield" title="Ad & tracker blocking active">&#128737;</div>
  </div>
  <script src="./renderer.js"></script>
</body>
</html>
