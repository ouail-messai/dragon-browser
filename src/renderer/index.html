<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dragon Browser</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=block" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet"/>
<style>
  :root {
    /* Dragon Design System — من DESIGN.md */
    --red: #E62129;
    --red-glow: rgba(230, 33, 41, 0.35);
    --navy: #1A222E;       /* Charcoal Navy — أدوات المتصفح */
    --void: #0F141B;       /* Deep Void — الخلفية */
    --steel: #94A3B8;      /* نص ثانوي */
    --border: #1E293B;
    --text: #FFFFFF;
    --mono: 'JetBrains Mono', monospace;
    --headline: 'Hanken Grotesk', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--void);
    color: var(--text);
    user-select: none;
    overflow: hidden;
  }

  /* ---------- الصف 1: التبويبات فقط (نظيف كيما Chrome) ---------- */
  #tabbar {
    -webkit-app-region: drag;
    display: flex;
    align-items: center;
    height: 40px;
    background: var(--navy);
    border-bottom: 1px solid var(--border);
    padding: 0 8px;
    gap: 6px;
  }
  .nav-btn {
    -webkit-app-region: no-drag;
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 4px;
    color: var(--text);
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.1s ease, opacity 0.1s ease;
  }
  .nav-btn:hover { background: rgba(255,255,255,0.08); }
  .nav-btn.disabled { opacity: 0.35; cursor: default; pointer-events: none; }
  .nav-btn .material-symbols-outlined { font-size: 19px; }

  #tabs-strip {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 2px;
    height: 100%;
    padding: 0 6px;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
  }
  #tabs-strip::-webkit-scrollbar { display: none; }

  .tab {
    -webkit-app-region: no-drag;
    display: flex;
    align-items: center;
    gap: 8px;
    height: 34px;
    padding: 0 12px;
    border-radius: 4px 4px 0 0;
    background: transparent;
    color: var(--steel);
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.02em;
    min-width: 110px;
    max-width: 190px;
    cursor: pointer;
    white-space: nowrap;
    position: relative;
    flex-shrink: 0;
  }
  .tab.active {
    background: rgba(255,255,255,0.05);
    color: var(--text);
    box-shadow: inset 0 2px 0 0 var(--red);
  }
  .tab .tab-title { overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .tab .close-btn {
    opacity: 0; flex-shrink: 0;
    width: 16px; height: 16px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 3px;
    font-size: 15px;
  }
  .tab:hover .close-btn { opacity: 0.6; }
  .tab .close-btn:hover { opacity: 1 !important; background: rgba(255,255,255,0.12); }

  #new-tab-btn {
    -webkit-app-region: no-drag;
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 4px;
    color: var(--steel);
    cursor: pointer;
    flex-shrink: 0;
  }
  #new-tab-btn:hover { background: rgba(255,255,255,0.08); color: var(--text); }

  /* ---------- الصف 2: التنقل + شريط العنوان + Extensions/Shield/القائمة (كيما Chrome بالضبط) ---------- */
  #toolbar-row {
    -webkit-app-region: drag;
    display: flex;
    align-items: center;
    gap: 6px;
    height: 44px;
    background: var(--void);
    border-bottom: 1px solid var(--border);
    padding: 0 8px;
  }
  #toolbar-row .nav-btn { -webkit-app-region: no-drag; }

  #chrome-right {
    -webkit-app-region: no-drag;
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }
  #shield-btn.active { color: #3ddc84; }

  /* ---------- شريط العنوان (Omnibox) ---------- */
  #address-bar {
    flex: 1;
    height: 28px;
    background: var(--navy);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 12.5px;
    padding: 0 12px;
    outline: none;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.3);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
    -webkit-app-region: no-drag;
  }
  #address-bar:focus { border-color: var(--red); box-shadow: inset 0 1px 2px rgba(0,0,0,0.3), 0 0 0 3px var(--red-glow); }
  #address-bar::placeholder { color: var(--steel); }

  /* ---------- شريط تحميل الصفحة (2px أحمر فوق) ---------- */
  #progress-bar {
    height: 2px;
    width: 0%;
    background: var(--red);
    box-shadow: 0 0 8px var(--red-glow);
    transition: width 0.25s ease, opacity 0.2s ease;
    opacity: 0;
  }
  #progress-bar.loading { opacity: 1; }

  /* ---------- قائمة "..." ---------- */
  #menu-panel {
    display: none;
    position: fixed;
    top: 44px; right: 8px;
    width: 220px;
    background: var(--navy);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px;
    z-index: 999;
    -webkit-app-region: no-drag;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    max-height: 80vh;
    overflow-y: auto;
  }
  #menu-panel.open { display: block; }
  .menu-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px;
    border-radius: 4px;
    font-size: 12.5px;
    cursor: pointer;
  }
  .menu-item:hover { background: rgba(255,255,255,0.06); }
  .menu-item .material-symbols-outlined { font-size: 17px; color: var(--steel); }
  .menu-sep { height: 1px; background: var(--border); margin: 6px 4px; }
  .menu-zoom { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; }
  .menu-zoom .zoom-controls { display: flex; align-items: center; gap: 4px; }
  .menu-zoom button {
    width: 24px; height: 24px; border-radius: 4px; border: 1px solid var(--border);
    background: var(--void); color: var(--text); cursor: pointer; font-size: 13px;
  }
  .menu-zoom button:hover { border-color: var(--red); }
  .menu-zoom .zoom-level { font-family: var(--mono); font-size: 11px; color: var(--steel); width: 36px; text-align: center; }

  /* ---------- نافذة Extensions المنسدلة الصغيرة (كيما Chrome بالضبط) ---------- */
  #ext-popup {
    display: none;
    position: fixed;
    top: 88px; right: 8px;
    width: 300px;
    background: var(--navy);
    border: 1px solid var(--border);
    border-radius: 8px;
    z-index: 999;
    -webkit-app-region: no-drag;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    overflow: hidden;
  }
  #ext-popup.open { display: block; }
  #ext-popup .ep-header { padding: 12px 14px; font-family: var(--headline); font-size: 13px; font-weight: 700; border-bottom: 1px solid var(--border); }
  #ext-popup .ep-list { max-height: 280px; overflow-y: auto; }
  #ext-popup .ep-empty { padding: 24px 14px; text-align: center; color: var(--steel); font-size: 12px; }
  #ext-popup .ep-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; }
  #ext-popup .ep-item:hover { background: rgba(255,255,255,0.04); }
  #ext-popup .ep-icon { width: 26px; height: 26px; border-radius: 5px; background: var(--void); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; }
  #ext-popup .ep-icon img { width: 100%; height: 100%; object-fit: contain; }
  #ext-popup .ep-icon .material-symbols-outlined { font-size: 14px; color: var(--steel); }
  #ext-popup .ep-name { font-size: 12px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #ext-popup .ep-footer {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px; border-top: 1px solid var(--border);
    font-size: 12px; color: var(--steel); cursor: pointer;
  }
  #ext-popup .ep-footer:hover { color: var(--text); background: rgba(255,255,255,0.04); }
  #ext-popup .ep-footer .material-symbols-outlined { font-size: 16px; }
</style>
</head>
<body>
  <div id="tabbar">
    <div id="tabs-strip"></div>
    <div id="new-tab-btn"><span class="material-symbols-outlined" style="font-size:18px;">add</span></div>
  </div>

  <div id="progress-bar"></div>

  <div id="toolbar-row">
    <div class="nav-btn" id="back"><span class="material-symbols-outlined">arrow_back</span></div>
    <div class="nav-btn" id="forward"><span class="material-symbols-outlined">arrow_forward</span></div>
    <div class="nav-btn" id="reload"><span class="material-symbols-outlined">refresh</span></div>
    <div class="nav-btn" id="home"><span class="material-symbols-outlined">home</span></div>

    <input id="address-bar" type="text" placeholder="Search or enter address" spellcheck="false" />

    <div id="chrome-right">
      <div class="nav-btn" id="extensions-btn" title="Extensions"><span class="material-symbols-outlined">extension</span></div>
      <div class="nav-btn active" id="shield-btn" title="Ad & tracker blocking active"><span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">shield</span></div>
      <div class="nav-btn" id="menu-btn"><span class="material-symbols-outlined">more_vert</span></div>
    </div>
  </div>

  <div id="ext-popup">
    <div class="ep-header">Extensions</div>
    <div class="ep-list" id="ep-list"></div>
    <div class="ep-footer" id="ep-manage"><span class="material-symbols-outlined">settings</span> Manage extensions</div>
  </div>

  <div id="menu-panel">
    <div class="menu-item" id="menu-new-tab"><span class="material-symbols-outlined">add</span> New Tab</div>
    <div class="menu-item" id="menu-new-window"><span class="material-symbols-outlined">open_in_new</span> New Window</div>
    <div class="menu-sep"></div>
    <div class="menu-item" id="menu-history"><span class="material-symbols-outlined">history</span> History</div>
    <div class="menu-item" id="menu-downloads"><span class="material-symbols-outlined">download</span> Downloads</div>
    <div class="menu-item" id="menu-extensions"><span class="material-symbols-outlined">extension</span> Extensions</div>
    <div class="menu-sep"></div>
    <div class="menu-item" id="menu-find"><span class="material-symbols-outlined">search</span> Find in Page</div>
    <div class="menu-zoom">
      <span style="color:var(--steel); display:flex; align-items:center; gap:10px;">
        <span class="material-symbols-outlined" style="font-size:17px;">zoom_in</span> Zoom
      </span>
      <div class="zoom-controls">
        <button id="zoom-out">−</button>
        <span class="zoom-level" id="zoom-level">100%</span>
        <button id="zoom-in">+</button>
      </div>
    </div>
    <div class="menu-item" id="menu-print"><span class="material-symbols-outlined">print</span> Print</div>
    <div class="menu-sep"></div>
    <div class="menu-item" id="menu-reload"><span class="material-symbols-outlined">refresh</span> Reload Page</div>
    <div class="menu-item" id="menu-home"><span class="material-symbols-outlined">home</span> Home</div>
    <div class="menu-sep"></div>
    <div class="menu-item" id="menu-exit"><span class="material-symbols-outlined">logout</span> Exit</div>
  </div>

  <script src="./renderer.js"></script>
</body>
</html>
