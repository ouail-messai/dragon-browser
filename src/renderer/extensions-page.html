<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Extensions — Dragon Browser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=block" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet">
<style>
  :root {
    --red: #E62129; --red-glow: rgba(230,33,41,0.35);
    --navy: #1A222E; --void: #0F141B; --steel: #94A3B8; --border: #1E293B; --text: #FFFFFF;
    --mono: 'JetBrains Mono', monospace; --headline: 'Hanken Grotesk', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--void); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 40px 24px 80px; }
  header h1 { font-family: var(--headline); font-size: 26px; font-weight: 800; margin-bottom: 4px; }
  header p { color: var(--steel); font-size: 13px; margin-bottom: 28px; }

  .install-card {
    background: var(--navy); border: 1px solid var(--border); border-radius: 8px;
    padding: 16px; display: flex; gap: 10px; margin-bottom: 28px;
  }
  .install-card input {
    flex: 1; background: var(--void); border: 1px solid var(--border); border-radius: 5px;
    color: var(--text); padding: 0 12px; height: 38px; font-family: var(--mono); font-size: 12.5px; outline: none;
  }
  .install-card input:focus { border-color: var(--red); }
  .install-card button {
    background: var(--red); color: #fff; border: none; border-radius: 5px;
    padding: 0 20px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .install-card button:disabled { opacity: 0.5; cursor: default; }
  #install-status { font-size: 12px; color: var(--steel); margin-top: 8px; }

  .section-title { font-family: var(--headline); font-size: 14px; font-weight: 700; color: var(--steel); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; }

  .ext-card {
    display: flex; align-items: flex-start; gap: 14px;
    background: var(--navy); border: 1px solid var(--border); border-radius: 8px;
    padding: 16px; margin-bottom: 12px;
  }
  .ext-icon {
    width: 44px; height: 44px; border-radius: 8px; flex-shrink: 0;
    background: var(--void); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .ext-icon img { width: 100%; height: 100%; object-fit: contain; }
  .ext-icon .material-symbols-outlined { color: var(--steel); font-size: 22px; }

  .ext-body { flex: 1; min-width: 0; }
  .ext-name { font-weight: 600; font-size: 14.5px; margin-bottom: 3px; }
  .ext-desc { font-size: 12px; color: var(--steel); line-height: 1.5; margin-bottom: 8px; }
  .ext-meta { font-family: var(--mono); font-size: 10.5px; color: var(--steel); display: flex; gap: 14px; }
  .ext-meta .disabled-label { color: var(--red); }

  .ext-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; flex-shrink: 0; }
  .remove-link { font-size: 11.5px; color: var(--steel); cursor: pointer; }
  .remove-link:hover { color: var(--red); }

  .switch { position: relative; width: 38px; height: 22px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; inset: 0; background: var(--border); border-radius: 999px; cursor: pointer;
    transition: background 0.15s ease;
  }
  .slider::before {
    content: ''; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px;
    background: #fff; border-radius: 50%; transition: transform 0.15s ease;
  }
  .switch input:checked + .slider { background: var(--red); }
  .switch input:checked + .slider::before { transform: translateX(16px); }

  .empty-state { color: var(--steel); font-size: 13px; text-align: center; padding: 40px 0; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Extensions</h1>
      <p>دعم تجريبي لإضافات Chrome Web Store — بعض الإضافات المعقدة قد ما تخدمش 100%.</p>
    </header>

    <div class="install-card">
      <input id="ext-id-input" type="text" placeholder="Extension ID or Chrome Web Store URL" />
      <button id="ext-install-btn">Install</button>
    </div>
    <div id="install-status"></div>

    <div class="section-title">Installed</div>
    <div id="ext-list"></div>
  </div>

  <script>
    const listEl = document.getElementById('ext-list');
    const input = document.getElementById('ext-id-input');
    const installBtn = document.getElementById('ext-install-btn');
    const statusEl = document.getElementById('install-status');

    function iconOrFallback(icon) {
      return icon
        ? `<img src="${icon}" alt="" />`
        : `<span class="material-symbols-outlined">extension</span>`;
    }

    async function render() {
      const list = await window.dragon.listExtensions();
      if (!list.length) {
        listEl.innerHTML = '<div class="empty-state">ما فيه أي إضافة منصبة حاليا</div>';
        return;
      }
      listEl.innerHTML = list.map(ext => `
        <div class="ext-card" data-id="${ext.id}">
          <div class="ext-icon">${iconOrFallback(ext.icon)}</div>
          <div class="ext-body">
            <div class="ext-name">${ext.name}</div>
            <div class="ext-desc">${ext.description || 'بلا وصف'}</div>
            <div class="ext-meta">
              <span>v${ext.version}</span>
              <span>ID: ${ext.id}</span>
              ${!ext.enabled ? '<span class="disabled-label">Disabled</span>' : ''}
            </div>
          </div>
          <div class="ext-actions">
            <label class="switch">
              <input type="checkbox" class="toggle" ${ext.enabled ? 'checked' : ''} data-id="${ext.id}" />
              <span class="slider"></span>
            </label>
            <span class="remove-link" data-id="${ext.id}">Remove</span>
          </div>
        </div>
      `).join('');

      listEl.querySelectorAll('.toggle').forEach(el => {
        el.addEventListener('change', async (e) => {
          await window.dragon.toggleExtension(el.dataset.id, el.checked);
          render();
        });
      });
      listEl.querySelectorAll('.remove-link').forEach(el => {
        el.addEventListener('click', async () => {
          await window.dragon.removeExtension(el.dataset.id);
          render();
        });
      });
    }

    installBtn.addEventListener('click', async () => {
      const val = input.value.trim();
      if (!val) return;
      installBtn.disabled = true;
      statusEl.textContent = 'جاري التنصيب...';
      const result = await window.dragon.installExtension(val);
      installBtn.disabled = false;
      if (result.success) {
        statusEl.textContent = `✅ تم تنصيب: ${result.extension.name}`;
        input.value = '';
        render();
      } else {
        statusEl.textContent = `❌ ${result.error}`;
      }
    });

    render();
  </script>
</body>
</html>
