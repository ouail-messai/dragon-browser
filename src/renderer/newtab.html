<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>New Tab — Dragon Browser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=block" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet">
<style>
  :root {
    --red: #E62129;
    --red-glow: rgba(230, 33, 41, 0.35);
    --navy: #1A222E;
    --void: #0F141B;
    --steel: #94A3B8;
    --border: #1E293B;
    --text: #FFFFFF;
    --mono: 'JetBrains Mono', monospace;
    --headline: 'Hanken Grotesk', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(circle at 50% 30%, #171c26 0%, var(--void) 55%, #080a0d 100%);
    font-family: 'Inter', -apple-system, sans-serif;
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    gap: 28px;
    position: relative;
  }
  .glow-blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(110px);
    pointer-events: none;
  }
  .glow-blob.one { top: -10%; left: 15%; width: 600px; height: 600px; background: rgba(230,33,41,0.08); }
  .glow-blob.two { bottom: -10%; right: 15%; width: 500px; height: 500px; background: rgba(148,163,184,0.06); }

  .logo-wrap {
    width: 96px; height: 96px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle, rgba(230,33,41,0.22), transparent 70%);
    position: relative; z-index: 1;
  }
  .logo-wrap img { width: 76px; height: 76px; border-radius: 50%; filter: drop-shadow(0 0 20px var(--red-glow)); }

  .greeting { text-align: center; z-index: 1; }
  .greeting p {
    font-size: 16px;
    color: var(--steel);
    margin-bottom: 6px;
  }
  .greeting h1 {
    font-family: var(--headline);
    font-size: 40px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--text);
  }

  form#search-form {
    width: min(620px, 88vw);
    position: relative;
    z-index: 1;
    margin-top: 6px;
  }
  #search-input {
    width: 100%;
    height: 58px;
    background: var(--navy);
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--text);
    font-size: 15px;
    padding: 0 96px 0 26px;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  #search-input:focus {
    border-color: var(--red);
    box-shadow: 0 0 0 3px var(--red-glow);
  }
  #search-input::placeholder { color: var(--steel); }

  .search-actions {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    display: flex; align-items: center; gap: 4px;
  }
  .search-actions button {
    border: none; background: transparent; cursor: pointer;
    width: 42px; height: 42px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: var(--steel);
  }
  .search-actions button:hover { background: rgba(255,255,255,0.06); color: var(--text); }
  .search-actions button.primary {
    background: var(--text); color: #000;
  }
  .search-actions button.primary:hover { background: rgba(255,255,255,0.85); }

  .status-line {
    position: absolute; bottom: 22px;
    display: flex; align-items: center; gap: 7px;
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--steel);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    z-index: 1;
  }
  .status-line .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #3ddc84; box-shadow: 0 0 8px #3ddc84;
  }
</style>
</head>
<body>
  <div class="glow-blob one"></div>
  <div class="glow-blob two"></div>

  <div class="logo-wrap">
    <img src="./assets/dragon-logo.png" alt="Dragon" onerror="this.style.display='none'" />
  </div>

  <div class="greeting">
    <p id="greeting-line">Happy to see you</p>
    <h1>How can I help you?</h1>
  </div>

  <form id="search-form">
    <input id="search-input" type="text" placeholder="Search now" autofocus autocomplete="off" />
    <div class="search-actions">
      <button type="button" title="Ad & tracker blocking active" disabled>
        <span class="material-symbols-outlined" style="font-size:19px; font-variation-settings: 'FILL' 1;">shield</span>
      </button>
      <button type="submit" class="primary" title="Search">
        <span class="material-symbols-outlined" style="font-size:19px;">arrow_forward</span>
      </button>
    </div>
  </form>

  <div class="status-line"><span class="dot"></span> Ad &amp; Tracker Blocking Active</div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const user = params.get('user');
    if (user) document.getElementById('greeting-line').textContent = 'Happy to see you, ' + user;

    document.getElementById('search-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const val = document.getElementById('search-input').value.trim();
      if (!val) return;
      const isUrl = /^(https?:\/\/)?([\w-]+\.)+[\w-]{2,}(\/\S*)?$/i.test(val) && !val.includes(' ');
      window.location.href = isUrl
        ? (val.startsWith('http') ? val : 'https://' + val)
        : 'https://www.google.com/search?q=' + encodeURIComponent(val);
    });
  </script>
</body>
</html>
