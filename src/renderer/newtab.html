<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>New Tab — Dragon Browser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
  :root {
    --red: #c41e3a;
    --red-glow: rgba(196, 30, 58, 0.35);
    --bg-dark: #0e1119;
    --bg-panel: #161b28;
    --border: #262c3d;
    --text: #f2f2f2;
    --text-dim: #6b7280;
    --mono: 'JetBrains Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background:
      radial-gradient(ellipse 55% 45% at 50% 0%, rgba(196,30,58,0.14), transparent 60%),
      linear-gradient(var(--border) 1px, transparent 1px) 0 0/48px 48px,
      linear-gradient(90deg, var(--border) 1px, transparent 1px) 0 0/48px 48px,
      var(--bg-dark);
    background-blend-mode: normal, overlay, overlay, normal;
    font-family: 'Inter', -apple-system, sans-serif;
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    gap: 26px;
    position: relative;
  }
  body::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, var(--bg-dark) 0%, transparent 18%, transparent 82%, var(--bg-dark) 100%);
    pointer-events: none;
  }

  .status-bar {
    position: absolute;
    top: 22px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--text-dim);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .status-bar .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #3ddc84;
    box-shadow: 0 0 8px #3ddc84;
    animation: blink 2s ease-in-out infinite;
  }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  .logo-wrap {
    width: 84px; height: 84px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    z-index: 1;
  }
  .logo-wrap::before {
    content: '';
    position: absolute; inset: -14px;
    border-radius: 50%;
    border: 1px solid rgba(196,30,58,0.25);
    animation: ring 6s linear infinite;
  }
  .logo-wrap::after {
    content: '';
    position: absolute; inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(196,30,58,0.3), transparent 70%);
    animation: pulse 4s ease-in-out infinite;
  }
  @keyframes ring { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes pulse {
    0%, 100% { filter: drop-shadow(0 0 10px var(--red-glow)); opacity: 0.85; }
    50% { filter: drop-shadow(0 0 24px var(--red-glow)); opacity: 1; }
  }
  .logo-wrap img { width: 66px; height: 66px; border-radius: 50%; position: relative; z-index: 1; }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 25px;
    font-weight: 600;
    letter-spacing: -0.02em;
    z-index: 1;
  }
  h1 span { color: var(--red); }
  .tagline {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--text-dim);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-top: -14px;
    z-index: 1;
  }

  form#search-form {
    width: min(560px, 88vw);
    position: relative;
    z-index: 1;
  }
  #search-input {
    width: 100%;
    height: 52px;
    background: rgba(22, 27, 40, 0.85);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-size: 14.5px;
    padding: 0 46px 0 46px;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  #search-input:focus {
    border-color: var(--red);
    box-shadow: 0 0 0 3px var(--red-glow), 0 0 24px rgba(196,30,58,0.15);
  }
  #search-input::placeholder { color: var(--text-dim); font-family: var(--mono); font-size: 12.5px; }
  .search-icon {
    position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
    width: 16px; height: 16px; color: var(--text-dim); pointer-events: none;
  }
  .search-kbd {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    font-family: var(--mono); font-size: 10px; color: var(--text-dim);
    border: 1px solid var(--border); border-radius: 5px; padding: 2px 6px;
    pointer-events: none;
  }

  .shortcuts {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    width: min(560px, 88vw);
    z-index: 1;
  }
  .shortcut {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: 76px;
    text-decoration: none;
    color: var(--text-dim);
    font-size: 10.5px;
    font-family: var(--mono);
    transition: color 0.15s ease, transform 0.15s ease;
  }
  .shortcut:hover { color: var(--text); transform: translateY(-3px); }
  .shortcut .icon {
    width: 48px; height: 48px;
    border-radius: 13px;
    background: rgba(22, 27, 40, 0.85);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    color: var(--text);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .shortcut:hover .icon {
    border-color: var(--red);
    box-shadow: 0 0 16px rgba(196,30,58,0.25);
  }
  .shortcut .icon svg { width: 20px; height: 20px; }

  .status-bar.bottom {
    top: auto; bottom: 22px;
    z-index: 1;
  }
  .status-bar.bottom .clock { color: var(--text); }
</style>
</head>
<body>
  <div class="status-bar">
    <span class="dot"></span> AD & TRACKER BLOCKING · ACTIVE
  </div>

  <div class="logo-wrap">
    <img src="./assets/dragon-logo.png" alt="Dragon" onerror="this.style.display='none'" />
  </div>
  <h1>Dragon <span>Browser</span></h1>
  <div class="tagline">Fast · Private · Yours</div>

  <form id="search-form">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input id="search-input" type="text" placeholder="search the web // enter a url" autofocus />
    <span class="search-kbd">&#8629;</span>
  </form>

  <div class="shortcuts">
    <a class="shortcut" href="https://www.google.com">
      <span class="icon"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><text x="12" y="16" font-size="10" text-anchor="middle" fill="currentColor" font-family="JetBrains Mono">G</text></svg></span>
      Google
    </a>
    <a class="shortcut" href="https://www.youtube.com">
      <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="6" width="18" height="12" rx="3"/><polygon points="10,9.5 10,14.5 15,12" fill="currentColor" stroke="none"/></svg></span>
      YouTube
    </a>
    <a class="shortcut" href="https://github.com">
      <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2a10 10 0 0 0-3.16 19.5c.5.1.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.46-1.16-1.11-1.47-1.11-1.47-.9-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.9 1.52 2.34 1.08 2.91.83.09-.65.35-1.08.63-1.33-2.22-.25-4.56-1.11-4.56-4.95 0-1.1.39-1.99 1.03-2.69-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.02a9.6 9.6 0 0 1 5 0c1.91-1.3 2.75-1.02 2.75-1.02.55 1.38.2 2.4.1 2.65.64.7 1.03 1.59 1.03 2.69 0 3.85-2.34 4.7-4.57 4.94.36.31.68.92.68 1.85v2.75c0 .26.18.58.69.48A10 10 0 0 0 12 2z"/></svg></span>
      GitHub
    </a>
    <a class="shortcut" href="https://www.wikipedia.org">
      <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M7 9l2.5 7L12 10l2.5 6L17 9"/></svg></span>
      Wikipedia
    </a>
    <a class="shortcut" href="https://www.reddit.com">
      <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="13" r="7"/><circle cx="8.5" cy="13.5" r="1" fill="currentColor" stroke="none"/><circle cx="15.5" cy="13.5" r="1" fill="currentColor" stroke="none"/><path d="M9 16.5c.8.6 1.9 1 3 1s2.2-.4 3-1"/><path d="M12 6V3M12 3l2.5 1.2"/></svg></span>
      Reddit
    </a>
  </div>

  <div class="status-bar bottom">
    <span class="clock" id="clock">--:--:--</span>
  </div>

  <script>
    document.getElementById('search-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const val = document.getElementById('search-input').value.trim();
      if (!val) return;
      const isUrl = /^(https?:\/\/)?([\w-]+\.)+[\w-]{2,}(\/\S*)?$/i.test(val) && !val.includes(' ');
      window.location.href = isUrl
        ? (val.startsWith('http') ? val : 'https://' + val)
        : 'https://www.google.com/search?q=' + encodeURIComponent(val);
    });

    function tick() {
      const d = new Date();
      const pad = n => String(n).padStart(2, '0');
      document.getElementById('clock').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
