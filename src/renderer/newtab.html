<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>New Tab — Dragon Browser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=block" rel="stylesheet">
<style>
  :root {
    --red: #c41e3a;
    --red-glow: rgba(196, 30, 58, 0.35);
    --bg-dark: #141824;
    --bg-panel: #1a1f2e;
    --border: #2a2f3d;
    --text: #f2f2f2;
    --text-dim: #8f96a3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: radial-gradient(ellipse 60% 50% at 50% 0%, rgba(196,30,58,0.10), transparent), var(--bg-dark);
    font-family: 'Inter', -apple-system, sans-serif;
    color: var(--text);
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    gap: 28px;
  }
  .logo-wrap {
    width: 92px; height: 92px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle, rgba(196,30,58,0.25), transparent 70%);
    animation: pulse 4s ease-in-out infinite;
  }
  .logo-wrap img { width: 72px; height: 72px; border-radius: 50%; }
  @keyframes pulse {
    0%, 100% { filter: drop-shadow(0 0 12px var(--red-glow)); }
    50% { filter: drop-shadow(0 0 26px var(--red-glow)); }
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--text);
  }
  h1 span { color: var(--red); }

  form#search-form {
    width: min(560px, 88vw);
    position: relative;
  }
  #search-input {
    width: 100%;
    height: 50px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    color: var(--text);
    font-size: 15px;
    padding: 0 20px;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  #search-input:focus {
    border-color: var(--red);
    box-shadow: 0 0 0 3px var(--red-glow);
  }
  #search-input::placeholder { color: var(--text-dim); }

  .shortcuts {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
    width: min(560px, 88vw);
  }
  .shortcut {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    width: 74px;
    text-decoration: none;
    color: var(--text-dim);
    font-size: 11px;
    transition: color 0.15s ease, transform 0.15s ease;
  }
  .shortcut:hover { color: var(--text); transform: translateY(-2px); }
  .shortcut .icon {
    width: 46px; height: 46px;
    border-radius: 12px;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
  }
  .shortcut:hover .icon { border-color: var(--red); }

  footer {
    position: absolute;
    bottom: 18px;
    font-size: 10.5px;
    color: var(--text-dim);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  footer .dot { width: 6px; height: 6px; border-radius: 50%; background: #3ddc84; }
</style>
</head>
<body>
  <div class="logo-wrap">
    <img src="./assets/dragon-logo.png" alt="Dragon" onerror="this.style.display='none'" />
  </div>
  <h1>Dragon <span>Browser</span></h1>

  <form id="search-form">
    <input id="search-input" type="text" placeholder="Search the web or enter a URL" autofocus />
  </form>

  <div class="shortcuts">
    <a class="shortcut" href="https://www.google.com"><span class="icon">G</span>Google</a>
    <a class="shortcut" href="https://www.youtube.com"><span class="icon">▶</span>YouTube</a>
    <a class="shortcut" href="https://github.com"><span class="icon">GH</span>GitHub</a>
    <a class="shortcut" href="https://www.wikipedia.org"><span class="icon">W</span>Wikipedia</a>
    <a class="shortcut" href="https://www.reddit.com"><span class="icon">R</span>Reddit</a>
  </div>

  <footer><span class="dot"></span> Ad & Tracker Blocking Active</footer>

  <script>
    document.getElementById('search-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const val = document.getElementById('search-input').value.trim();
      if (!val) return;
      const isUrl = /^(https?:\/\/)?([\w-]+\.)+[\w-]{2,}(\/\S*)?$/i.test(val) && !val.includes(' ');
      window.location.href = isUrl
        ? (val.startsWith('http') ? val : 'https://' + val)
        : 'https://www.google.com/search?q=' + encodeURIComponent(val);
    });
  </script>
</body>
</html>
