name: Build Dragon Browser

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false # مهم: نظام وحد يطيح ما يلغيش الأنظمة الأخرى (كانو يلغاو بلا داعي حتى لو كانو راح ينجحو)
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Fix execute permissions on Linux build tools (fixes ERR_ELECTRON_BUILDER_CANNOT_EXECUTE)
        if: matrix.os == 'ubuntu-latest'
        run: |
          find node_modules/app-builder-bin -type f -name "app-builder" -exec chmod +x {} \;
          find node_modules -type d -name "*.app" -prune -o -type f \( -path "*linux*" -o -path "*mac*" \) -exec chmod +x {} \; 2>/dev/null || true

      - name: Bump version (auto-update needs an increasing version number)
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const p = require('./package.json');
            p.version = '0.1.' + process.env.GITHUB_RUN_NUMBER;
            fs.writeFileSync('./package.json', JSON.stringify(p, null, 2));
            console.log('version set to', p.version);
          "

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run dist:win

      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        run: npm run dist:mac

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npm run dist:linux

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dragon-browser-${{ matrix.os }}
          path: release/**/*

  release:
    needs: build
    if: ${{ !cancelled() }} # ننشر حتى لو نظام وحد طاح — الأنظمة الناجحة الأخرى ما تتلغاش
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded

      - name: Flatten installer files
        run: |
          mkdir -p to-release
          find downloaded -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.yml" -o -name "*.blockmap" \) -exec cp {} to-release/ \;
          ls -la to-release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Dragon Browser - Latest Build"
          body: "Auto-built release of Dragon Browser. Choose the file for your OS."
          files: to-release/*
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
